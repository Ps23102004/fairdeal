# Tiers must be real Ollama-pulled model tags (llm-ladder talks to Ollama's
# native /api/chat, not LM Studio's OpenAI-compatible endpoint) — the
# "-mlx"-suffixed names below are LM Studio/MLX models served on a different
# port (1234) and were never reachable here; confirmed live 2026-08-16 when
# chat parsing 503'd. qwen2.5:3b is pulled locally as a small, fast, always-
# available first tier. Add a second/third tier by `ollama pull`-ing more
# models and listing them here, largest/most-capable last.
chains:
  extract_json:
    - model: qwen2.5:3b
      samples: 3
      threshold: 0.7
