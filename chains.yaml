# Tiers must be real Ollama-pulled model tags (llm-ladder talks to Ollama's
# native /api/chat). Correction to an earlier assumption here: "-mlx" tags
# are NOT automatically LM Studio-only — Ollama's own registry hosts MLX
# builds too (confirmed live 2026-08-16: `ollama pull gemma4:e4b-mlx` +
# a real /api/chat call both succeeded on this machine). The original
# day-1 chain (gemma4:e4b-mlx / qwen3.8:27b-mlx / ornith:35b-q4_K_M) was
# still broken, but the actual cause was the broken ~/.ollama/models
# symlink (external drive unplugged), not the tag names — those specific
# tags were never individually re-verified against a working daemon.
# gemma4:e4b-mlx is Parth's preferred local model, pulled locally.
chains:
  extract_json:
    - model: gemma4:e4b-mlx
      samples: 3
      threshold: 0.7
