# Tiers must be real Ollama-pulled model tags (llm-ladder talks to Ollama's
# native /api/chat, not LM Studio's OpenAI-compatible endpoint) — the
# "-mlx"-suffixed names are LM Studio/MLX models served on a different port
# (1234) and were never reachable here; confirmed live 2026-08-16 when chat
# parsing 503'd. gemma4:e4b is the Ollama-native (non-MLX) build of Parth's
# preferred local model, pulled locally 2026-08-16. Add a second/third tier
# by `ollama pull`-ing more models and listing them here, largest last.
chains:
  extract_json:
    - model: gemma4:e4b
      samples: 3
      threshold: 0.7
